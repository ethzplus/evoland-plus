# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  workflow_dispatch:

name: "R CMD check (full)"

env:
  QUARTO_LOG_LEVEL: DEBUG

permissions: read-all

jobs:
  R-CMD-check:
    strategy:
      matrix:
        include:
          - { name: container, os: ubuntu-latest, container: rocker/r2u4ci }
          - { name: macos, os: macos-latest }
          # - { name: ubuntu,    os: ubuntu-latest }
          # TODO do we want to test on windows? does pak manage sys. deps?

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: eddelbuettel/github-actions/r-ci@master

      # r-ci installs R packages; the quarto vignette engine shells out to the CLI, which
      # is not an R package and has to come from somewhere else
      - uses: quarto-dev/quarto-actions/setup@v2

      # TODO check if we can make use of caching for macos + ubuntu sys. deps.
      #
      # - name: Resolve macOS dependency versions
      #   if: runner.os == 'macos'
      #   run: |
      #     brew update
      #     brew info --json gdal proj | jq -r '.[].versions.stable' > brew-versions.txt

      # - name: Cache macOS system dependencies
      #   if: runner.os == 'macos'
      #   id: cache-brew
      #   uses: actions/cache@v5
      #   with:
      #     path: |
      #       /opt/homebrew/Cellar/
      #       /usr/local/Cellar/
      #     key: ${{ runner.os }}-brew-gdal-proj-${{ hashFiles('brew-versions.txt') }}

      - name: Install macOS dependencies
        if: runner.os == 'macos'
        run: brew install gdal proj

      - name: Install dependencies as apt binaries
        run: ./run.sh install_all

      - name: R CMD check
        run: ./run.sh run_tests

      - name: Dump check log
        if: failure()
        run: ./run.sh dump_logs"
