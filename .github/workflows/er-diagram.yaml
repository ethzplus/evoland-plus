# Fail if the ER diagram in devdocs/design/database.md is out of date with the table
# constructors in R/*_t.R. Regenerate it locally with `Rscript devdocs/er_diagram.R`.

on:
  pull_request:
    paths:
      - "R/**"
      - "devdocs/**"
      - ".github/workflows/er-diagram.yaml"
  workflow_dispatch:

name: "ER diagram up to date"

permissions: read-all

jobs:
  er-diagram:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: eddelbuettel/github-actions/r-ci@master

      - name: Install dependencies as apt binaries
        run: ./run.sh install_deps

      - name: Install package
        run: R CMD INSTALL --no-docs --no-multiarch .

      - name: Regenerate ER diagram
        run: Rscript devdocs/er_diagram.R

      - name: Check for changes
        run: |
          if ! git diff --exit-code devdocs/design/database.md; then
            echo "::error file=devdocs/design/database.md::ER diagram is out of date; run 'Rscript devdocs/er_diagram.R' and commit the result"
            exit 1
          fi
